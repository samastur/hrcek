{% extends "base.html" %}{% load i18n %}
{% block heading %}{% trans "Change your password" %}{% endblock %}
{% block content %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% trans "Save my new password" %}</button>
  </form>
  <p><a href="{% url 'accounts:account' %}">{% trans "Back to your account" %}</a></p>
{% endblock %}
