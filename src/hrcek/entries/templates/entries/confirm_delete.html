{% extends "base.html" %}{% load i18n %}
{% block heading %}{% trans "Delete this entry?" %}{% endblock %}
{% block content %}
  <p>{{ entry.display_title }}</p>
  <p>{% trans "This cannot be undone." %}</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">{% trans "Yes, delete it" %}</button>
  </form>
  <p><a href="{% url 'entries:list' %}">{% trans "Keep it" %}</a></p>
{% endblock %}
